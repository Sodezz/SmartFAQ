services:
  web:
    container_name: server
    build: .
    command: /start
    depends_on:
      - database
    env_file:
      - .env
    ports:
      - 8000:8000
    restart: always

  database:
    image: postgres:latest
    container_name: database
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT_OUT: ${POSTGRES_PORT_OUT}
      POSTGRES_HOST: ${POSTGRES_HOST}
    ports:
      - ${POSTGRES_PORT_IN}:${POSTGRES_PORT_OUT}

