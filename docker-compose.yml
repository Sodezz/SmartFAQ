services:
  web:
    container_name: my_server
    build: .
    command: /start
    depends_on:
      DataBase:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - 8000:8000
    restart: always

  DataBase:
    image: postgres
    container_name: my_database
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "5623"
      PGDATA: "/var/lib/postgresql/data/pgdata"
      POSTGRES_PORT: "5432"
      #POSTGRES_HOST: "DataBase"
    ports:
      - 54324:5432
    volumes:
      - ./volumes/pgdata:/var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "postgres" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
#bash -c 'uvicorn main:app --reload --host 127.0.0.1 --port 8000'